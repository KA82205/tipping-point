name: Update data and deploy site
# The name each run is listed under, so the record shows what started it.
run-name: "${{ inputs.source == 'clock' && 'Check: outside clock' || github.event.action == 'heartbeat' && 'Check: heartbeat' || github.event.action == 'upstream-updated' && 'Told by another site' || github.event_name == 'schedule' && 'Check: schedule' || github.event_name == 'push' && 'After a push' || inputs.check == true && 'Check: by hand' || 'Run by hand' }}"

on:
  schedule:
    # Every hour. Each run reads the poll feeds; FRED is read when a release could be out (pipeline/update.py,
    # economy_due). If no input has changed since the published Nowcast was made, the run ends there: the models are
    # not run again, nothing is saved and the site is not deployed. The first run of each day always goes through.
    # GitHub starts scheduled runs late, sometimes by hours, so the minute is only a rough one.
    - cron: "17 * * * *"
  repository_dispatch:       # "check now", from an outside scheduler (see The Margin's RUNBOOK.md): treated exactly as a scheduled run
    types: [heartbeat]
  workflow_dispatch:         # "Run workflow" button in the Actions tab
    inputs:
      check:
        description: "Run as the hourly check does: stop if nothing is new"
        type: boolean
        default: false
      source:
        description: "Who asked for this run (the outside clock sends: clock)"
        required: false
        default: "hand"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      pushed: ${{ steps.save.outputs.pushed }}
    steps:
      # The branch as it stands when the run starts, not as it stood when the run was asked for: a run that waited
      # behind another one must start from what that one saved.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build 2024 data and map shapes
        run: |
          python pipeline/make_2024_data.py
          cd pipeline && npm install --no-save us-atlas@3.0.1 topojson-client@3.1.0 && cd ..
          node pipeline/build_map.js

      - name: Run tests (economy formula, nominee detection, 2024 odds, when a run is made)
        run: |
          python pipeline/tests/test_economy.py
          python pipeline/tests/test_candidates.py
          python pipeline/tests/test_runs.py
          python pipeline/tests/test_watch.py
          node pipeline/tests/test_uncertainty.js

      # A run started by hand or by a push always runs the models (the code or the site may have changed).
      - name: Fetch latest polls and economic data, run the model if anything is new
        id: update
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CHECK: ${{ inputs.check }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "repository_dispatch" ] || [ "$CHECK" = "true" ]; then
            python pipeline/update.py
          else
            python pipeline/update.py --force
          fi

      # Once a day: has either model's author published a forecast for 2028? Found or not, the run goes on.
      - name: Look for a new publication by the models' authors
        continue-on-error: true
        run: python pipeline/watch.py

      - name: Save new data to the repository
        id: save
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          for p in docs/watch.json docs/nowcast.js docs/history.js docs/forecast.js docs/record pipeline/history.json pipeline/frozen pipeline/cache pipeline/log docs/data.js docs/us-states.js pipeline/results_2024.json; do
            if [ -e "$p" ]; then git add -f "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Data update $(TZ=America/New_York date '+%Y-%m-%d %H:%M')"
            # Runs are made one at a time, so a push is refused only if somebody else pushed meanwhile. Generated
            # files cannot be merged: this run's result is dropped, and the next run starts from the new state.
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::The repository changed while this run was working. Its result was not saved; the next run starts from the new state."
            fi
          fi

      # The site is deployed when there is something new to show: a new Nowcast, or a run started by hand or by a push.
      - name: Is there anything to deploy?
        id: decide
        run: echo "deploy=${{ steps.save.outputs.pushed == 'true' || (github.event_name != 'schedule' && github.event_name != 'repository_dispatch' && inputs.check != true) }}" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.decide.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.deploy == 'true'
        with:
          path: docs

      # The Margin also runs on its own schedule, but GitHub starts scheduled runs when it pleases. Every run here that finds
      # The Margin has not checked for most of an hour wakes it. The Margin never wakes this site back, so there is no loop.
      - name: Wake The Margin if it has not checked lately
        if: always()
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then exit 0; fi
          mins=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/KA82205/the-margin/actions/workflows/update.yml/runs?per_page=1" \
            | python3 -c "import sys,json,datetime as d; r=json.load(sys.stdin)['workflow_runs']; print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(r[0]['created_at'].replace('Z','+00:00'))).total_seconds()//60) if r else 9999)" || echo 0)
          echo "The Margin last started a run $mins minutes ago."
          if [ "$mins" -ge 50 ]; then
            curl -fsS -X POST -H "Authorization: Bearer $DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/KA82205/the-margin/dispatches -d '{"event_type":"heartbeat","client_payload":{"from":"tipping-point"}}' \
              && echo "Woke The Margin." || echo "::warning::The Margin could not be woken."
          fi

      # A source that is down for an hour should not send an e-mail every hour. A failed scheduled run is marked as
      # failed at 7 a.m., 1 p.m. and 7 p.m. Eastern only, so a fault that lasts is reported three times a day and a
      # passing one not at all. A run started by hand or by a push is always marked.
      - name: Flag a failed data update
        if: steps.update.outcome == 'failure'
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$hour" = "07" ] || [ "$hour" = "13" ] || [ "$hour" = "19" ]; then
            echo "::error::The data update step failed; the site keeps the previous data. Open the 'Fetch latest polls' step above for details."
            exit 1
          fi
          echo "::warning::The data update step failed on this run; the site keeps the previous data. The next hourly run tries again."

  deploy:
    needs: update
    if: always() && needs.update.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # GitHub Pages now and then refuses a deployment ("try again later") or cannot see the upload yet.
      # Neither is a fault in the data, so wait and try again, twice, before calling the run failed.
      - name: Wait before a second try
        if: steps.deploy.outcome == 'failure'
        run: sleep 120
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before a third try
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 300
      - id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # The Margin reads this site's Nowcast. With a DISPATCH_TOKEN secret it is told once the new Nowcast is live;
      # without one it finds the change at its own next hourly check.
      - name: Tell The Margin
        if: needs.update.outputs.pushed == 'true'
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "No DISPATCH_TOKEN secret: The Margin will see the new Nowcast at its next hourly check."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/KA82205/the-margin/dispatches \
            -d '{"event_type":"upstream-updated","client_payload":{"from":"tipping-point"}}' \
            || echo "::warning::The Margin could not be told; its hourly check will pick the change up."
